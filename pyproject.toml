[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-circles-tools"
version = "0.1.0"
description = "Crop circle analysis and research tools"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.3.0",
    "astropy>=6.0.0",
    "skyfield>=1.49",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["tools"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv", "*.txt", "*.yaml"]
