name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tools/forensics/tests/ tools/ccat/tests/ tools/signal/tests/ --tb=short -q
